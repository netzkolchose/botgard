{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style type="text/css">
        @page {
            margin: 2cm 1.5cm 4cm 2cm;
            width: 21cm;
            height: 27cm;

            @bottom-left {
                padding-top: 7mm;
                padding-bottom: 7mm;
                content: "{% block page-bottom-left-content %}{% endblock %}";
                text-align: center;
                vertical-align: bottom;
                font-size: 8pt;
            }
            @bottom-right {
                padding-top: 7mm;
                padding-bottom: 7mm;
                content: "{% trans 'page' %} " counter(page) "/" counter(pages);
                vertical-align: bottom;
                font-size: 10px;
            }
        }

        body {
            font-size: 9pt;
            font-family: sans-serif;
        }

        .content-outer {
            position: relative;
        }
        .content-inner {
            max-width: 19cm;
            margin: 0 auto;
        }

        .flex-row {
            display: flex;
            padding: -.5rem -.5rem -.5rem 0;
        }
        .flex-row > div {
            margin: .5rem .5rem .5rem 0;
        }
        .flex-row.space-between {
            justify-content: space-between;
        }
        .indent {
            margin-left: 1rem;
        }
        .value {
            font-weight: bold;
        }
        .item {
            margin-bottom: .5rem;
            max-width: 25rem;
        }

        .page-break {
            break-inside: avoid-page;
        }

        {% block extra_style %}{% endblock %}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

<div class="content-outer">
    <div class="content-inner">
        {{ content }}
    </div>
</div>

</body>
