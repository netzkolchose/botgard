name: unittests

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]

jobs:

  test-ubuntu:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install jpeg-dev zlib-dev freetype-dev lcms2-dev openjpeg-dev tiff-dev tk-dev tcl-dev \
            libxslt-dev libxml2-dev librsvg rsvg-convert texmf-dist texlive ttf-liberation ttf-linux-libertine

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv env
          source env/bin/activate
          pip install -r app/requirements.txt

      - name: Run tests
        run: |
          source env/bin/activate
          cd app
          ./manage.py migrate
          ./manage.py collectstatic          
          ./manage.py test
